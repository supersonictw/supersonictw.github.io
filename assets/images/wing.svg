<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 171 150" width="171" height="150" fill="none">
  <defs>
    <filter id="prism-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Crystal Stems -->
  <g stroke="#231F28" stroke-width="2.2" stroke-linecap="butt">
    <line x1="22.5" y1="53" x2="22.5" y2="61" />
    <line x1="38.5" y1="39" x2="38.5" y2="47" />
    <line x1="54.5" y1="26" x2="54.5" y2="35" />
    <line x1="71.5" y1="26" x2="71.5" y2="36" />
    <line x1="87.5" y1="41" x2="87.5" y2="52" />
    <line x1="103.5" y1="57" x2="103.5" y2="68" />
    <line x1="119.5" y1="74" x2="119.5" y2="84" />
    <line x1="135.5" y1="90" x2="135.5" y2="100" />
  </g>
  <!-- Main Angled Wing Branch -->
  <polygon points="8,61 64,14 164,114 103,57 64,21 12,66" fill="#231F28" />
  <!-- 8 Rainbow Crystal Prisms -->
  <g filter="url(#prism-glow)">
    <!-- 1: Cyan -->
    <g>
      <polygon points="22.5,60 29,76 22.5,92 16,76" fill="#5CE1E6" />
      <polygon points="22.5,60 29,76 22.5,76" fill="#95EBEF" />
    </g>
    <!-- 2: Sapphire Blue -->
    <g>
      <polygon points="38.5,46 45,62 38.5,78 32,62" fill="#3876F2" />
      <polygon points="38.5,46 45,62 38.5,62" fill="#7EA6F7" />
    </g>
    <!-- 3: Amethyst Violet -->
    <g>
      <polygon points="54.5,34 61,50 54.5,66 48,50" fill="#8C52FF" />
      <polygon points="54.5,34 61,50 54.5,50" fill="#B58CFF" />
    </g>
    <!-- 4: Rose Magenta -->
    <g>
      <polygon points="71.5,35 78,50.5 71.5,66 65,50.5" fill="#FF66C4" />
      <polygon points="71.5,35 78,50.5 71.5,50.5" fill="#FF9CD9" />
    </g>
    <!-- 5: Sunset Orange -->
    <g>
      <polygon points="87.5,51 94,66.5 87.5,82 81,66.5" fill="#FF914D" />
      <polygon points="87.5,51 94,66.5 87.5,66.5" fill="#FFB78B" />
    </g>
    <!-- 6: Citrine Gold -->
    <g>
      <polygon points="103.5,67 110,82.5 103.5,98 97,82.5" fill="#FFDE59" />
      <polygon points="103.5,67 110,82.5 103.5,82.5" fill="#FFEA93" />
    </g>
    <!-- 7: Peridot Green -->
    <g>
      <polygon points="119.5,83 126,98.5 119.5,114 113,98.5" fill="#7ED957" />
      <polygon points="119.5,83 126,98.5 119.5,98.5" fill="#ABE692" />
    </g>
    <!-- 8: Aqua Cyan -->
    <g>
      <polygon points="135.5,99 142,114.5 135.5,130 129,114.5" fill="#5CE1E6" />
      <polygon points="135.5,99 142,114.5 135.5,114.5" fill="#95EBEF" />
    </g>
  </g>
</svg>
